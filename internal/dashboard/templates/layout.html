{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Review Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/" class="logo">OCR Dashboard</a>
  <div class="nav-links">
    <a href="/">Repos</a>
    <a href="/stats">Statistics</a>
  </div>
</nav>
<main class="container">
{{template "content" .}}
</main>
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>Mark as Intentional</h3>
    <p>This change is intentional and does not need to be fixed. Please explain why (min 10 characters):</p>
    <textarea id="modal-reason" rows="4" placeholder="Enter reason..."></textarea>
    <div class="modal-meta">
      <input id="modal-actor" type="text" placeholder="Your name" required>
    </div>
    <div id="modal-error" class="error" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-warning" onclick="submitIntentional()">Confirm Intentional</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
